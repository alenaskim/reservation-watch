name: Reservation watch

on:
  # Manual test runs only. The always-on server (see README) does the real watching;
  # a schedule here as well would send duplicate alerts.
  workflow_dispatch: {}

concurrency:
  group: reservation-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium (only if any OpenTable restaurants are listed)
        run: |
          if grep -q "opentable:" restaurants.yaml; then
            python -m playwright install --with-deps chromium
          fi

      # Remembers which slots were already alerted, so you don't get pinged every run.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: seen-${{ github.run_id }}
