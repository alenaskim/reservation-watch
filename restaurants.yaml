# Restaurants to watch. Add or remove entries, commit, and the next run picks them up.
#
# Per restaurant (anything left out uses `defaults` below):
#   name:       anything you like (used in the alert)
#   resy:       the restaurant's resy.com page URL        } use one of
#   opentable:  the restaurant's opentable.com page URL   } these two
#   dates:      specific dates to check, e.g. [2026-11-07, 2026-11-08]
#     — or —
#   next_days:  check the next N days
#   weekdays:   only these days, e.g. [fri, sat]
#   times:      time window, e.g. "18:00-21:30"
#   party_size: number of people
#   resy_venue_id: pins the exact Resy venue (the run log prints it)
#   drop:       when the restaurant releases new tables (Resy only), e.g.
#                 drop: {time: "11:00", days_ahead: 20, skip: [tue]}
#               5 min before, you get a heads-up; from 30 s before to 10 min after,
#               it checks every ~5 s and sends an urgent alert when tables appear.
#               `skip` = weekdays with no release. Times are New York time.

party_size: 2

defaults:
  next_days: 21
  times: "17:30-21:30"

watch:
  - name: Tatiana
    resy: https://resy.com/cities/new-york-ny/venues/tatiana
    drop: {time: "12:00", days_ahead: 28}      # per Resy's Q&A with the restaurant

  - name: 4 Charles Prime Rib
    resy: https://resy.com/cities/new-york-ny/venues/4-charles-prime-rib
    drop: {time: "09:00", days_ahead: 21}      # most guides; some say 20 days

  - name: Torrisi
    resy: https://resy.com/cities/new-york-ny/venues/torrisi
    drop: {time: "10:00", days_ahead: 30}      # 30 days is official; the time is NOT confirmed

  - name: Ambassadors Clubhouse
    resy: https://resy.com/cities/new-york-ny/venues/ambassadors-clubhouse-new-york
    # release time unknown; background checks only

  - name: Bungalow
    resy: https://resy.com/cities/new-york-ny/venues/bungalow
    drop: {time: "11:00", days_ahead: 20, skip: [tue]}   # per Resy's interview with the owner

  - name: Ha's Snack Bar
    resy: https://resy.com/cities/new-york-ny/venues/has-snack-bar
    # ~20 days out, release time unknown; background checks only

  # Kabawa books on OpenTable, 14 days out, open Tue–Sat.
  - name: Kabawa
    opentable: https://www.opentable.com/r/kabawa-new-york
    next_days: 14
    weekdays: [tue, wed, thu, fri, sat]

  # Adda (East Village) books through SevenRooms, which isn't supported yet.
